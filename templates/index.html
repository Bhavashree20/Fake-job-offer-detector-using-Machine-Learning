<!DOCTYPE html>
<html>
<head>
    <title>Fake Job Offer Detector</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="Logo">

    <h2>Fake Job Offer Detector</h2>

    <form action="/predict" method="POST">

        <label>Enter Job Description</label>

        <textarea name="job_description" rows="10" placeholder="Paste the job description here..." required></textarea>

        <input type="submit" value="Predict">

    </form>

    {% if prediction %}
        <h3>Prediction: {{ prediction }}</h3>
    {% endif %}

</div>

</body>
</html>
