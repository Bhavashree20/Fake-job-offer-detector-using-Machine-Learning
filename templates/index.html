<!DOCTYPE html>
<html>
<head>
    <title>Fake Job Offer Detector</title>
</head>
<body>

    <h2>Fake Job Offer Detector</h2>

    <form action="/predict" method="POST">
        <textarea name="job_description" rows="10" cols="50" placeholder="Enter Job Description"></textarea>
        <br><br>

        <input type="submit" value="Predict">
    </form>

    {% if prediction %}
        <h3>Prediction: {{ prediction }}</h3>
    {% endif %}

</body>
</html>
